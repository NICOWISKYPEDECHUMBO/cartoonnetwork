document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

layIn{from{opacity:0}to{opacity:1}}\n    input[type=range]{accent-color:#caa86a}\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:{{wallStyle}};display:flex;flex-direction:column\">\n\n  <header style=\"position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:16px 30px;background:linear-gradient(180deg,rgba(20,24,22,.62),rgba(20,24,22,.3));backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);border-bottom:1px solid rgba(255,255,255,.08)\">\n    <div style=\"display:flex;flex-direction:column;gap:1px;min-width:200px\">\n      <div style=\"font-family:'Playfair Display',serif;font-weight:700;font-size:25px;letter-spacing:.2px;color:#f6efe0;line-height:1\">Galeria de Tarefas<\u002Fdiv>\n      <div style=\"font-size:12.5px;color:rgba(243,237,225,.6);letter-spacing:.2px\">Pinte com um dedo para revelar · use dois dedos para dar zoom no quadro.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;gap:18px;flex-wrap:wrap\">\n      <div style=\"display:flex;align-items:center;gap:11px;padding:8px 14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:999px\">\n        <span style=\"font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:rgba(243,237,225,.7);font-weight:600\">Pincel<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px\">\n          <span style=\"display:block;width:{{brushDot}}px;height:{{brushDot}}px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3e6c8,#caa86a)\"><\u002Fspan>\n        <\u002Fspan>\n        <input type=\"range\" min=\"10\" max=\"70\" value=\"{{brush}}\" onchange=\"{{setBrush}}\" oninput=\"{{setBrush}}\" style=\"width:118px\">\n        <span style=\"font:500 12px 'DM Mono',monospace;color:#e9dcbf;width:34px\">{{brush}}px<\u002Fspan>\n      <\u002Fdiv>\n\n      <button onclick=\"{{openAdd}}\" style=\"display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border:none;border-radius:999px;cursor:pointer;font-family:'Albert Sans';font-weight:600;font-size:14px;color:#2a1c0b;background:linear-gradient(160deg,#e0c188,#b08a45);box-shadow:0 4px 14px -4px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.4) inset\" style-hover=\"filter:brightness(1.05);transform:translateY(-1px)\">\n        <span style=\"font-size:18px;line-height:0;margin-top:-1px\">+<\u002Fspan> Nova tarefa\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"height:11px;background:linear-gradient(180deg,rgba(0,0,0,.32),rgba(0,0,0,0) 60%);box-shadow:0 2px 5px rgba(0,0,0,.25)\"><\u002Fdiv>\n\n  <main style=\"flex:1;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:34px 40px;padding:54px 40px 40px;max-width:1200px;width:100%;margin:0 auto\">\n\n    <sc-for list=\"{{tasks}}\" as=\"item\" hint-placeholder-count=\"0\">\n      <sc-if value=\"{{item.onWall}}\">\n        <div style=\"{{item.cardStyle}}\">\n          <button data-id=\"{{item.id}}\" onclick=\"{{askDelete}}\" title=\"Excluir quadro\" style=\"position:absolute;top:-10px;right:-10px;z-index:4;width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;background:rgba(28,20,10,.82);color:#f0e6d2;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.45)\" style-hover=\"background:#8a2f24;transform:scale(1.08)\">✕<\u002Fbutton>\n          <div style=\"position:absolute;top:-21px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:2;pointer-events:none\">\n            <div style=\"width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#efe7d4,#6f6657 72%);box-shadow:0 2px 3px rgba(0,0,0,.55)\"><\u002Fdiv>\n            <div style=\"width:2px;height:17px;background:linear-gradient(#2f281e,#594b38)\"><\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:14px;border-radius:4px;background:{{frameGradient}};box-shadow:0 1px 0 rgba(255,255,255,.22) inset,0 -2px 5px rgba(0,0,0,.45) inset,0 22px 34px -14px rgba(0,0,0,.6),0 7px 14px -7px rgba(0,0,0,.55)\">\n            <div style=\"padding:12px;background:{{matColor}};box-shadow:0 1px 4px rgba(0,0,0,.35) inset\">\n              <div style=\"{{item.photoBoxStyle}}\">\n                <div data-task-id=\"{{item.id}}\" ref=\"{{setLayerRef}}\" style=\"position:absolute;inset:0;transform-origin:0 0;will-change:transform\">\n                  <div style=\"{{item.bgStyle}}\"><\u002Fdiv>\n                  <canvas data-task-id=\"{{item.id}}\" ref=\"{{setCanvasRef}}\" style=\"position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair\"><\u002Fcanvas>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:11px;width:{{item.boxW}}px;padding:9px 11px;border-radius:3px;background:linear-gradient(165deg,#d8bd87,#a98a4d);box-shadow:0 4px 9px -4px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.35) inset;display:flex;flex-direction:column;gap:7px\">\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <span style=\"display:inline-flex;color:{{item.catColor}}\">{{item.icon}}<\u002Fspan>\n              <span title=\"{{item.title}}\" style=\"flex:1;min-width:0;font-weight:600;font-size:13px;color:#2c1d0c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{item.title}}<\u002Fspan>\n              <span style=\"font:500 11px 'DM Mono',monospace;color:#5b4622\">{{item.percent}}%<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height:6px;border-radius:5px;background:rgba(60,40,15,.28);overflow:hidden\">\n              <div style=\"height:100%;width:{{item.percent}}%;background:{{item.catColor}};border-radius:5px;transition:width .14s ease\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-for>\n\n    <sc-if value=\"{{noActive}}\">\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:14px;padding:70px 20px;text-align:center;color:rgba(243,237,225,.62);animation:fadeUp .4s\">\n        <div style=\"width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#efe7d4,#6f6657 72%)\"><\u002Fdiv>\n        <div style=\"width:78px;height:60px;border:2px dashed rgba(243,237,225,.3);border-radius:3px\"><\u002Fdiv>\n        <div style=\"font-family:'Playfair Display',serif;font-style:italic;font-size:18px;color:rgba(243,237,225,.8)\">A parede está vazia<\u002Fdiv>\n        <div style=\"font-size:13.5px;max-width:280px\">Pendure sua primeira tarefa com uma foto e comece a pintar.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n\n  <sc-if value=\"{{hasDone}}\">\n    <section style=\"margin-top:auto;padding:26px 30px 38px;background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.34));border-top:1px solid rgba(0,0,0,.25)\">\n      <div style=\"max-width:1200px;margin:0 auto\">\n        <div style=\"display:flex;align-items:baseline;gap:11px;margin-bottom:18px\">\n          <span style=\"font-family:'Playfair Display',serif;font-weight:600;font-size:19px;color:#f3ede1\">Concluídas<\u002Fspan>\n          <span style=\"font:500 12px 'DM Mono',monospace;color:rgba(243,237,225,.55)\">{{doneCount}} quadro(s) no acervo<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:20px 22px\">\n          <sc-for list=\"{{doneTasks}}\" as=\"d\" hint-placeholder-count=\"0\">\n            <div title=\"{{d.title}}\" style=\"position:relative;display:flex;flex-direction:column;align-items:center;gap:6px\">\n              <button data-id=\"{{d.id}}\" onclick=\"{{askDelete}}\" title=\"Excluir do acervo\" style=\"position:absolute;top:-7px;right:-7px;z-index:3;width:22px;height:22px;border-radius:50%;border:none;cursor:pointer;background:rgba(28,20,10,.82);color:#f0e6d2;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.45)\" style-hover=\"background:#8a2f24\">✕<\u002Fbutton>\n              <div style=\"padding:6px;border-radius:3px;background:{{frameGradient}};box-shadow:0 8px 16px -8px rgba(0,0,0,.6);transition:transform .25s ease\" style-hover=\"transform:translateY(-5px) rotate(-1deg)\">\n                <div style=\"{{d.photoBoxStyle}}\">\n                  <div style=\"position:absolute;right:4px;bottom:4px;width:17px;height:17px;border-radius:50%;background:{{d.catColor}};display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.5)\">\n                    <span style=\"display:block;width:7px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(0px,-1px)\"><\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"max-width:96px;font-size:11px;color:rgba(243,237,225,.62);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{d.title}}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{adding}}\">\n    <div onclick=\"{{closeAdd}}\" style=\"position:fixed;inset:0;z-index:60;background:rgba(14,16,15,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:24px;animation:overlayIn .2s\">\n      <div onclick=\"{{stop}}\" style=\"width:min(440px,100%);background:#f3ede1;border-radius:14px;padding:26px;box-shadow:0 30px 70px -20px rgba(0,0,0,.6);animation:modalIn .26s cubic-bezier(.2,.7,.3,1);color:#2c1d0c\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:18px\">\n          <div style=\"font-family:'Playfair Display',serif;font-weight:700;font-size:21px\">Pendurar uma tarefa<\u002Fdiv>\n          <button onclick=\"{{closeAdd}}\" style=\"border:none;background:rgba(44,29,12,.08);width:30px;height:30px;border-radius:50%;cursor:pointer;color:#2c1d0c;font-size:16px;line-height:1\">✕<\u002Fbutton>\n        <\u002Fdiv>\n\n        <label style=\"display:block;font-size:12px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:#7a6244;margin-bottom:7px\">Título<\u002Flabel>\n        <input value=\"{{draft.title}}\" oninput=\"{{setDraftTitle}}\" placeholder=\"Ex: Terminar o relatório\" style=\"width:100%;padding:11px 13px;border:1px solid #cdbfa3;border-radius:9px;background:#fff;font-family:'Albert Sans';font-size:14.5px;color:#2c1d0c;outline:none;margin-bottom:18px\">\n\n        <label style=\"display:block;font-size:12px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:#7a6244;margin-bottom:8px\">Categoria<\u002Flabel>\n        <div style=\"display:flex;gap:9px;margin-bottom:18px\">\n          <sc-for list=\"{{catChips}}\" as=\"chip\" hint-placeholder-count=\"3\">\n            <button data-cat=\"{{chip.cat}}\" onclick=\"{{setDraftCat}}\" style=\"{{chip.style}}\">\n              <span style=\"display:inline-flex\">{{chip.icon}}<\u002Fspan>{{chip.label}}\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <label style=\"display:block;font-size:12px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:#7a6244;margin-bottom:8px\">Foto<\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;min-height:130px;padding:16px;border:2px dashed #c8b894;border-radius:11px;background:#fbf8f1;cursor:pointer;text-align:center;margin-bottom:22px\" style-hover=\"border-color:#a98a4d;background:#fff\">\n          <sc-if value=\"{{draft.image}}\">\n            <div style=\"{{draftPreviewStyle}}\"><\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{noDraftImage}}\">\n            <div style=\"width:34px;height:34px;border-radius:9px;background:#ece2cd;display:flex;align-items:center;justify-content:center\">\n              <div style=\"width:16px;height:13px;border:2px solid #a98a4d;border-radius:3px\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:13.5px;color:#7a6244;font-weight:500\">Toque para enviar uma foto<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#a8966f\">As cores reais serão preservadas<\u002Fdiv>\n          <\u002Fsc-if>\n          <input type=\"file\" accept=\"image/*\" onchange=\"{{pickFile}}\" style=\"display:none\">\n        <\u002Flabel>\n\n        <div style=\"display:flex;gap:11px;justify-content:flex-end\">\n          <button onclick=\"{{closeAdd}}\" style=\"padding:11px 18px;border:1px solid #cdbfa3;background:transparent;border-radius:9px;cursor:pointer;font-family:'Albert Sans';font-weight:600;font-size:14px;color:#5b4622\">Cancelar<\u002Fbutton>\n          <button onclick=\"{{confirmAdd}}\" style=\"{{confirmStyle}}\">Pendurar quadro<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{pendingDelete}}\">\n    <div onclick=\"{{cancelDelete}}\" style=\"position:fixed;inset:0;z-index:70;background:rgba(14,16,15,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px;animation:overlayIn .2s\">\n      <div onclick=\"{{stop}}\" style=\"width:min(360px,100%);background:#f3ede1;border-radius:14px;padding:24px;box-shadow:0 30px 70px -20px rgba(0,0,0,.6);animation:modalIn .24s cubic-bezier(.2,.7,.3,1);color:#2c1d0c\">\n        <div style=\"font-family:'Playfair Display',serif;font-weight:700;font-size:19px;margin-bottom:9px\">Excluir quadro?<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.5;color:#6b5736;margin-bottom:22px\">«{{pendingDeleteTitle}}» será removido para sempre. Esta ação não pode ser desfeita.<\u002Fdiv>\n        <div style=\"display:flex;gap:10px;justify-content:flex-end\">\n          <button onclick=\"{{cancelDelete}}\" style=\"padding:10px 17px;border:1px solid #cdbfa3;background:transparent;border-radius:9px;cursor:pointer;font-family:'Albert Sans';font-weight:600;font-size:14px;color:#5b4622\">Cancelar<\u002Fbutton>\n          <button onclick=\"{{confirmDelete}}\" style=\"padding:10px 17px;border:none;border-radius:9px;cursor:pointer;font-family:'Albert Sans';font-weight:600;font-size:14px;color:#fff;background:#a13226\">Excluir<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;wallTone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Sage&quot;,&quot;options&quot;:[&quot;Sage&quot;,&quot;Clay&quot;,&quot;Charcoal&quot;,&quot;Greige&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;frameWood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Walnut&quot;,&quot;options&quot;:[&quot;Walnut&quot;,&quot;Oak&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;brushSize&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:26,&quot;min&quot;:10,&quot;max&quot;:70,&quot;tsType&quot;:&quot;number&quot;}}\">\nclass Component extends DCLogic {\n  images = new Map();\n  canvases = new Map();\n  ctxs = new Map();\n  inited = new Set();\n  layers = new Map();\n  pointers = new Map();\n  pinch = new Map();\n  zoom = new Map();\n  masks = new Map();\n  maskURL = new Map();\n  KEY = 'galeria_tarefas_v1';\n  activeId = null;\n  lastPt = null;\n  scale = 1;\n  _seq = 0;\n\n  state = {\n    tasks: [],\n    brush: this.props.brushSize || 26,\n    adding: false,\n    pendingDelete: null,\n    draft: { title: '', cat: 'pintura', image: null, aspect: 1 }\n  };\n\n  CATS = {\n    pintura: { label: 'Pintura', color: 'oklch(0.64 0.15 45)' },\n    compras: { label: 'Compras', color: 'oklch(0.6 0.13 155)' },\n n      const photoBoxStyle = { position: 'relative', width: boxW + 'px', aspectRatio: String(t.aspect), overflow: 'hidden', backgroundColor: '#1c1c1c', borderRadius: '1px', touchAction: 'none' };\n      const bgStyle = { position: 'absolute', inset: 0, backgroundImage: `url(\"${t.image}\")`, backgroundSize: 'cover', backgroundPosition: 'center' };\n      return { id: t.id, title: t.title, image: t.image, boxW, percent: Math.round(t.percent), catColor: cm.color, icon: this.icon(t.cat), onWall, cardStyle, photoBoxStyle, bgStyle };\n    });\n\n    const doneTasks = this.state.tasks.filter(t => t.status === 'done').slice().reverse().map(t => {\n      const cm = this.CATS[t.cat] || this.CATS.pintura;\n      const boxW = clamp(Math.round(96 * t.aspect), 70, 150);\n      return { id: t.id, title: t.title, image: t.image, catColor: cm.color, photoBoxStyle: { position: 'relative', width: boxW + 'px', aspectRatio: String(t.aspect), overflow: 'hidden', backgroundColor: '#1c1c1c', borderRadius: '1px', backgroundImage: `url(\"${t.image}\")`, backgroundSize: 'cover', backgroundPosition: 'center' } };\n    });\n\n    const noActive = tasks.filter(t => t.onWall).length === 0 && !this.state.tasks.some(t => t.status === 'done');\n    const hasDone = doneTasks.length > 0;\n\n    const draftCat = this.state.draft.cat;\n    const catChips = Object.keys(this.CATS).map(cat => {\n      const cm = this.CATS[cat];\n      const sel = cat === draftCat;\n      return {\n        cat, label: cm.label, icon: this.icon(cat),\n        style: {\n          flex: 1, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: '6px',\n          padding: '10px 8px', borderRadius: '9px', cursor: 'pointer', fontFamily: \"'Albert Sans'\", fontWeight: 600, fontSize: '13px',\n          border: sel ? '1.5px solid ' + cm.color : '1.5px solid #d6c9ad',\n          background: sel ? 'color-mix(in srgb,' + cm.color + ' 14%, #fff)' : '#fff',\n          color: sel ? cm.color : '#6b5736'\n        }\n      };\n    });\n\n    const canAdd = !!(this.state.draft.title.trim() && this.state.draft.image);\n    const confirmStyle = {\n      padding: '11px 18px', border: 'none', borderRadius: '9px', cursor: canAdd ? 'pointer' : 'not-allowed',\n      fontFamily: \"'Albert Sans'\", fontWeight: 600, fontSize: '14px', color: '#2a1c0b',\n      background: 'linear-gradient(160deg,#e0c188,#b08a45)', opacity: canAdd ? 1 : .45\n    };\n\n    return {\n      wallStyle, frameGradient, matColor,\n      tasks, doneTasks, doneCount: doneTasks.length, noActive, hasDone,\n      brush: this.state.brush, brushDot: Math.round(6 + this.state.brush * 0.18),\n      adding: this.state.adding, draft: this.state.draft, noDraftImage: !this.state.draft.image,\n      draftPreviewStyle: this.state.draft.image ? { width: '100%', height: '150px', backgroundImage: `url(\"${this.state.draft.image}\")`, backgroundSize: 'contain', backgroundRepeat: 'no-repeat', backgroundPosition: 'center', borderRadius: '7px', boxShadow: '0 6px 16px -6px rgba(0,0,0,.4)' } : {},\n      catChips, confirmStyle,\n      askDelete: this.askDelete, cancelDelete: this.cancelDelete, confirmDelete: this.confirmDelete,\n      pendingDelete: this.state.pendingDelete || '',\n      pendingDeleteTitle: (this.state.tasks.find(t => t.id === this.state.pendingDelete) || {}).title || '',\n      setCanvasRef: this.setCanvasRef, setLayerRef: this.setLayerRef, onPointerDown: this.onPointerDown, onPointerMove: this.onPointerMove, onPointerUp: this.onPointerUp,\n      setBrush: this.setBrush, openAdd: this.openAdd, closeAdd: this.closeAdd, stop: this.stop,\n      setDraftTitle: this.setDraftTitle, setDraftCat: this.setDraftCat, pickFile: this.pickFile, confirmAdd: this.confirmAdd\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
